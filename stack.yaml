# for GHC-9.12.4
resolver: nightly-2026-11-11

flags:
  sendfile:
    portable: true
  gitit:
    plugins: true
  # Link zlib via the zlib package instead of pkg-config. On Arch-based
  # distributions zlib.pc adds -L/usr/lib, which makes the linker pick up the
  # system's identically named libHS*.so files instead of Stack's own.
  digest:
    pkg-config: false

packages:
- '../clafer'
- '.'

# GHC compiles the modules of a package on 8 threads, which takes a third less time than one
# thread; 16 threads are not faster.
# (build: semaphore: true, GHC's -jsem, fails with Stack 3.11.1: "semOpen: does not exist".)
ghc-options:
  "$everything": -j8
